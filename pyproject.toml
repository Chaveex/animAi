[project]
name = "animai"
version = "0.1.0"
description = "Animate pixel art sprites with rigid-piece skeletons, no deformation. Claude-driven CLI + visual editor."
requires-python = ">=3.11"
dependencies = [
    "pillow>=10",
    "numpy>=1.26",
]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
rembg = ["rembg>=2.0"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
animai = "animai.cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["animai*"]

[tool.setuptools.package-data]
animai = ["presets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
